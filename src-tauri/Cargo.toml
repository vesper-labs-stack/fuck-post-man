[package]
name = "fuck-post-man"
version = "0.1.0"
description = "A lightweight Postman-like API debugging tool"
authors = ["PostMan"]
edition = "2021"
rust-version = "1.77.2"

# The library crate holds all app logic so it can be shared with mobile targets.
[lib]
name = "fuck_post_man_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls (schannel on Windows) is kept via default features; no OpenSSL needed.
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "multipart"] }
# Native save-file dialog for exporting runner reports.
rfd = "0.15"
# OS-level secure storage for secrets (Windows Credential Manager / macOS Keychain).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Async runtime primitives for the load-test engine (JoinSet + Semaphore + ticker).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
